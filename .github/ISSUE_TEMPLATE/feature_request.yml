name: ✨ 기능 요청
description: 새로운 기능이나 개선 사항을 제안해주세요
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        기능 요청을 제안해주시기 전에 기존 이슈를 확인해주세요.

  - type: dropdown
    id: driver
    attributes:
      label: 드라이버
      description: 어떤 드라이버에 대한 기능인가요?
      options:
        - Xiaomi MIoT
        - 기타
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 문제 또는 불편사항
      description: 어떤 문제를 해결하고 싶으신가요?
      placeholder: "예: 현재 선풍기의 풍량을 조절할 수 없습니다."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 제안하는 해결책
      description: 어떤 기능을 추가하거나 개선하면 좋을까요?
      placeholder: "예: 선풍기 풍량 제어 기능을 추가해주세요."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 대안
      description: 고려해본 다른 방법이 있나요?
      placeholder: 현재는 다른 방법이 없습니다 / 커스텀 capability를 사용해야 합니다 등
      render: markdown
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: 추가 정보
      description: 기타 참고사항, 스크린샷, 또는 링크를 추가해주세요
      render: markdown
    validations:
      required: false
