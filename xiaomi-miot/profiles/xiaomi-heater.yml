name: xiaomi-heater
components:
  - id: main
    capabilities:
      - id: switch
        version: 1
      - id: thermostatHeatingSetpoint
        version: 1
      - id: temperatureMeasurement
        version: 1
      - id: relativeHumidityMeasurement
        version: 1
      - id: refresh
        version: 1
    categories:
      - name: Heater
preferences:
  - title: "Device Token"
    name: token
    required: true
    preferenceType: string
    definition:
      stringType: text
      default: ""
