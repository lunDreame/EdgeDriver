name: xiaomi-climate
components:
  - id: main
    capabilities:
      - id: switch
        version: 1
      - id: thermostatMode
        version: 1
      - id: thermostatCoolingSetpoint
        version: 1
      - id: thermostatHeatingSetpoint
        version: 1
      - id: temperatureMeasurement
        version: 1
      - id: relativeHumidityMeasurement
        version: 1
      - id: fanSpeed
        version: 1
      - id: fanOscillationMode
        version: 1
      - id: dictionaryangel05655.targetHumidity
        version: 1
      - id: carbonDioxideMeasurement
        version: 1
      - id: powerMeter
        version: 1
      - id: energyMeter
        version: 1
      - id: refresh
        version: 1
    categories:
      - name: Thermostat
preferences:
  - title: "Device Token"
    name: token
    required: true
    preferenceType: string
    definition:
      stringType: text
      default: ""
